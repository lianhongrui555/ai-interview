<!doctype html>
<!-- 声明网页使用 HTML5 标准，并设置页面语言为简体中文。 -->
<html lang="zh-CN">
<head>
  <!-- 使用 UTF-8 编码，确保中文能够正常显示。 -->
  <meta charset="utf-8">
  <!-- 让网页在手机和电脑屏幕上都能正确缩放。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 设置浏览器标签页显示的标题。 -->
  <title>本地 AI 聊天</title>
  <style>
    /* 清除浏览器默认的页面外边距和内边距。 */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* 设置页面整体背景和文字样式。 */
    body {
      min-height: 100vh;
      color: #172033;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fbff 50%, #edf8f4 100%);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }

    /* 创建居中的聊天应用外框。 */
    .app {
      width: min(920px, calc(100% - 32px));
      height: min(780px, calc(100vh - 48px));
      margin: 24px auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #dce7f5;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 70px rgba(41, 74, 120, 0.16);
    }

    /* 设置顶部标题栏的布局。 */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      color: white;
      background: linear-gradient(120deg, #1769e0, #2d8ef0);
    }

    /* 设置标题大小。 */
    header h1 { font-size: 20px; }

    /* 设置顶部副标题的样式。 */
    header p { margin-top: 4px; color: rgba(255, 255, 255, 0.82); font-size: 12px; }

    /* 设置“新对话”按钮的样式。 */
    #new-chat {
      padding: 9px 15px;
      color: #1769e0;
      background: white;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
    }

    /* 设置天气卡片外层的布局。 */
    #weather-panel {
      flex-shrink: 0;
      padding: 16px 22px 18px;
      border-bottom: 1px solid #e2ebf5;
      background: linear-gradient(135deg, #f7fbff 0%, #eef8ff 100%);
    }

    /* 设置天气卡片标题区域。 */
    .weather-title h2 { font-size: 16px; }
    .weather-title p { margin-top: 3px; color: #74849a; font-size: 12px; }

    /* 设置天气查询表单，覆盖底部聊天表单的默认样式。 */
    #weather-form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding: 0;
      border: 0;
      background: transparent;
    }

    /* 设置城市输入框。 */
    #weather-city {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      color: #172033;
      border: 1px solid #cfdcec;
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    /* 设置城市输入框获得焦点时的样式。 */
    #weather-city:focus { border-color: #2d8ef0; box-shadow: 0 0 0 3px rgba(45, 142, 240, 0.12); }

    /* 设置天气查询按钮。 */
    #weather-button {
      height: 44px;
      padding: 0 18px;
      color: white;
      background: #1769e0;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    /* 设置天气状态提示。 */
    #weather-status { min-height: 18px; margin-top: 8px; color: #74849a; font-size: 12px; }

    /* 设置天气结果卡片，默认隐藏，查询成功后显示。 */
    #weather-result {
      display: none;
      margin-top: 10px;
      padding: 14px;
      border: 1px solid #dce7f5;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 8px 20px rgba(44, 75, 117, 0.06);
    }
    #weather-result.visible { display: block; }

    /* 设置天气主要数据区域。 */
    .weather-main { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .weather-location { color: #27364d; font-size: 13px; font-weight: 700; }
    .weather-description { margin-top: 3px; color: #1769e0; font-size: 18px; font-weight: 700; }
    .weather-temperature { color: #172033; font-size: 28px; font-weight: 800; }

    /* 设置湿度、风速等补充数据。 */
    .weather-details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .weather-detail { padding: 8px 10px; border-radius: 10px; background: #f4f8fd; }
    .weather-detail span { display: block; color: #74849a; font-size: 11px; }
    .weather-detail strong { display: block; margin-top: 3px; color: #27364d; font-size: 14px; }

    /* 设置完整天气文字说明。 */
    .weather-text { margin-top: 11px; color: #52627a; font-size: 12px; line-height: 1.6; }
    /* 设置消息区域的滚动布局。 */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      background: #f8fbff;
    }

    /* 设置每条消息的横向布局。 */
    .message { display: flex; margin-bottom: 16px; }
    .message.user { justify-content: flex-end; }

    /* 设置消息气泡的通用样式。 */
    .bubble {
      max-width: min(76%, 650px);
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      animation: appear 180ms ease-out;
    }

    /* 设置用户消息气泡的颜色。 */
    .message.user .bubble {
      color: white;
      background: #1769e0;
      border-bottom-right-radius: 5px;
    }

    /* 设置 AI 消息气泡的颜色。 */
    .message.assistant .bubble {
      color: #27364d;
      background: white;
      border: 1px solid #e0e9f5;
      border-bottom-left-radius: 5px;
      box-shadow: 0 8px 20px rgba(44, 75, 117, 0.06);
    }

    /* 设置每条新消息出现时的轻微动画。 */
    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 设置底部输入区域的布局。 */
    form {
      display: flex;
      gap: 12px;
      padding: 16px 18px;
      border-top: 1px solid #e2ebf5;
      background: white;
    }

    /* 设置输入框样式，并允许它随内容轻微增高。 */
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 130px;
      padding: 13px 15px;
      resize: none;
      color: #172033;
      border: 1px solid #cfdcec;
      border-radius: 14px;
      outline: none;
      font: inherit;
    }

    /* 设置输入框获得焦点时的边框颜色。 */
    textarea:focus { border-color: #2d8ef0; box-shadow: 0 0 0 3px rgba(45, 142, 240, 0.12); }

    /* 设置发送按钮样式。 */
    button[type="submit"] {
      align-self: flex-end;
      height: 48px;
      padding: 0 22px;
      color: white;
      background: #1769e0;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
    }

    /* 设置按钮禁用时的样式。 */
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    /* 设置页面底部状态提示。 */
    #status { min-height: 0; padding: 0 20px 10px; color: #74849a; background: white; font-size: 12px; }

    /* 在小屏幕上减少外框边距和气泡宽度限制。 */
    @media (max-width: 640px) {
      .app { width: 100%; height: 100vh; margin: 0; border: 0; border-radius: 0; }
      header { padding: 14px 16px; }
      #messages { padding: 16px; }
      .bubble { max-width: 86%; }
      form { padding: 12px; }
      button[type="submit"] { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <!-- app 是整个聊天应用的外框。 -->
  <div class="app">
    <!-- 页面顶部显示标题、说明和新对话按钮。 -->
    <header>
      <div>
        <h1>本地 AI 聊天</h1>
        <p>Dify + Ollama + qwen2.5:7b</p>
      </div>
      <button id="new-chat" type="button">新对话</button>
    </header>

    <!-- 天气卡片用于输入城市并展示实时天气结果。 -->
    <section id="weather-panel">
      <div class="weather-title">
        <h2>实时天气查询</h2>
        <p>输入城市名称，查看当前天气、温度、湿度和风速</p>
      </div>

      <!-- 天气表单只负责收集城市名称，不刷新整个网页。 -->
      <form id="weather-form">
        <input id="weather-city" type="text" maxlength="50" value="北京" placeholder="例如：北京、上海、广州" autocomplete="off">
        <button id="weather-button" type="submit">查询天气</button>
      </form>

      <!-- 天气状态用于显示加载中或错误提示。 -->
      <div id="weather-status">请输入城市名称后点击查询。</div>

      <!-- 天气结果区域默认隐藏，查询成功后显示。 -->
      <div id="weather-result" aria-live="polite">
        <div class="weather-main">
          <div>
            <div id="weather-location" class="weather-location"></div>
            <div id="weather-description" class="weather-description"></div>
          </div>
          <div id="weather-temperature" class="weather-temperature">--</div>
        </div>
        <div class="weather-details">
          <div class="weather-detail">
            <span>相对湿度</span>
            <strong id="weather-humidity">--</strong>
          </div>
          <div class="weather-detail">
            <span>风速</span>
            <strong id="weather-wind">--</strong>
          </div>
          <div class="weather-detail">
            <span>数据来源</span>
            <strong>Open-Meteo</strong>
          </div>
        </div>
        <div id="weather-text" class="weather-text"></div>
      </div>
    </section>
    <!-- messages 用来显示所有聊天消息。 -->
    <main id="messages" aria-live="polite">
      <div class="message assistant">
        <div class="bubble">你好，我是运行在你电脑上的 AI 助手。请输入问题开始聊天。</div>
      </div>
    </main>

    <!-- 表单负责收集用户输入并触发发送。 -->
    <form id="chat-form">
      <textarea id="message-input" rows="1" placeholder="输入问题，按 Enter 发送，Shift + Enter 换行"></textarea>
      <button id="send-button" type="submit">发送</button>
    </form>

    <!-- status 用来显示“正在思考”或错误提示。 -->
    <div id="status"></div>
  </div>

  <script>
    // 获取消息列表、表单、输入框、发送按钮和状态栏元素。
    const messagesElement = document.getElementById("messages");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const statusElement = document.getElementById("status");
    const newChatButton = document.getElementById("new-chat");
    const weatherForm = document.getElementById("weather-form");
    const weatherCityInput = document.getElementById("weather-city");
    const weatherButton = document.getElementById("weather-button");
    const weatherStatus = document.getElementById("weather-status");
    const weatherResult = document.getElementById("weather-result");
    const weatherLocation = document.getElementById("weather-location");
    const weatherDescription = document.getElementById("weather-description");
    const weatherTemperature = document.getElementById("weather-temperature");
    const weatherHumidity = document.getElementById("weather-humidity");
    const weatherWind = document.getElementById("weather-wind");
    const weatherText = document.getElementById("weather-text");

    // 保存 Dify 返回的对话编号，让连续消息保持上下文。
    let conversationId = "";

    // 创建一个消息气泡并加入页面。
    function addMessage(text, role) {
      // 创建消息外层容器。
      const messageElement = document.createElement("div");
      // 根据 user 或 assistant 添加不同样式类。
      messageElement.className = `message ${role}`;
      // 创建气泡元素。
      const bubbleElement = document.createElement("div");
      // 设置气泡样式类。
      bubbleElement.className = "bubble";
      // 使用 textContent 写入文字，避免网页执行用户输入中的代码。
      bubbleElement.textContent = text;
      // 把气泡放入消息容器。
      messageElement.appendChild(bubbleElement);
      // 把完整消息加入页面消息区。
      messagesElement.appendChild(messageElement);
      // 自动滚动到页面最底部。
      messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    // 修改输入框高度，让长文字也能看见。
    function resizeInput() {
      // 先恢复默认高度。
      messageInput.style.height = "48px";
      // 再根据实际内容设置高度，最高不超过 CSS 的限制。
      messageInput.style.height = `${Math.min(messageInput.scrollHeight, 130)}px`;
    }

    // 发送用户问题到本地后端。
    async function sendMessage(question) {
      // 立即显示用户消息。
      addMessage(question, "user");
      // 显示等待状态。
      statusElement.textContent = "本地模型正在思考，请稍候……";
      // 暂时禁用发送按钮，避免重复提交。
      sendButton.disabled = true;
      // 清空输入框。
      messageInput.value = "";
      // 恢复输入框默认高度。
      resizeInput();

      try {
        // 向 Flask 后端发送消息和当前对话编号。
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question, conversation_id: conversationId }),
        });
        // 把后端返回的数据转换为 JavaScript 对象。
        const data = await response.json();
        // 如果 HTTP 状态码不是成功状态，就抛出错误。
        if (!response.ok) throw new Error(data.error || `请求失败：HTTP ${response.status}`);
        // 保存对话编号，供下一条消息继续上下文。
        conversationId = data.conversation_id || conversationId;
        // 显示 AI 回答。
        addMessage(data.answer, "assistant");
      } catch (error) {
        // 把错误信息显示为 AI 消息，便于用户看到。
        addMessage(`出错了：${error.message}`, "assistant");
      } finally {
        // 清除等待状态。
        statusElement.textContent = "";
        // 恢复发送按钮。
        sendButton.disabled = false;
        // 把焦点放回输入框。
        messageInput.focus();
      }
    }

    // 把后端返回的数值格式化成适合页面显示的文字。
    function formatWeatherNumber(value, digits = 1) {
      // 把输入转换为数字，并检查是否为有效数值。
      const number = Number(value);
      // 有效时保留指定小数位，无效时显示占位符。
      return Number.isFinite(number) ? number.toFixed(digits) : "--";
    }

    // 请求后端天气接口并更新天气卡片。
    async function queryWeather(city) {
      // 查询期间禁用按钮，避免重复提交。
      weatherButton.disabled = true;
      // 显示加载状态。
      weatherStatus.textContent = "正在查询天气，请稍候……";

      try {
        // 只把城市名称发送给 Flask 后端，Dify Key 不会进入浏览器。
        const response = await fetch("/api/weather", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ city }),
        });
        // 把后端返回的数据转换为 JavaScript 对象。
        const data = await response.json();
        // 如果后端返回失败状态，就显示错误信息。
        if (!response.ok) throw new Error(data.error || `请求失败：HTTP ${response.status}`);

        // 更新地点、天气描述和温度。
        weatherLocation.textContent = `${data.city || city} 实时天气`;
        weatherDescription.textContent = data.description || "天气";
        weatherTemperature.textContent = `${formatWeatherNumber(data.temperature)}°C`;
        // 更新湿度和风速。
        weatherHumidity.textContent = `${formatWeatherNumber(data.humidity, 0)}%`;
        weatherWind.textContent = `${formatWeatherNumber(data.wind_speed)} km/h`;
        // 显示包含体感温度和数据时间的完整说明。
        weatherText.textContent = data.weather_text || "";
        // 显示结果区域并更新成功提示。
        weatherResult.classList.add("visible");
        weatherStatus.textContent = "查询成功。";
      } catch (error) {
        // 查询失败时隐藏旧结果，并显示可读错误。
        weatherResult.classList.remove("visible");
        weatherStatus.textContent = `查询失败：${error.message}`;
      } finally {
        // 无论成功或失败都恢复按钮。
        weatherButton.disabled = false;
      }
    }

    // 监听天气表单提交，不刷新页面。
    weatherForm.addEventListener("submit", (event) => {
      // 阻止浏览器默认提交行为。
      event.preventDefault();
      // 读取城市名称并去掉首尾空白。
      const city = weatherCityInput.value.trim();
      // 空输入时显示提示，不调用后端。
      if (!city) {
        weatherStatus.textContent = "请输入城市名称。";
        return;
      }
      // 发起天气查询。
      queryWeather(city);
    });
    // 监听表单提交事件。
    chatForm.addEventListener("submit", (event) => {
      // 阻止浏览器刷新页面。
      event.preventDefault();
      // 读取输入内容并去掉首尾空格。
      const question = messageInput.value.trim();
      // 如果输入不为空，就发送消息。
      if (question) sendMessage(question);
    });

    // 监听键盘按键，支持 Enter 发送和 Shift + Enter 换行。
    messageInput.addEventListener("keydown", (event) => {
      // 如果按下 Enter 且没有同时按 Shift，就发送消息。
      if (event.key === "Enter" && !event.shiftKey) {
        // 阻止默认换行行为。
        event.preventDefault();
        // 触发表单提交。
        chatForm.requestSubmit();
      }
    });

    // 输入内容变化时自动调整文本框高度。
    messageInput.addEventListener("input", resizeInput);

    // 点击“新对话”时清空上下文和页面消息。
    newChatButton.addEventListener("click", () => {
      // 清空 Dify 对话编号。
      conversationId = "";
      // 清空所有消息气泡。
      messagesElement.innerHTML = "";
      // 重新显示欢迎消息。
      addMessage("已经开始新对话。请输入问题。", "assistant");
      // 把焦点放回输入框。
      messageInput.focus();
    });
  </script>
</body>
</html>
