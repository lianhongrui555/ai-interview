    - data:
        code: "\nimport json\n\n# WMO 天气代码对应的中文说明。\nWEATHER_CODE_MAP = {\n    0: \"\
          晴朗\",\n    1: \"大部晴朗\",\n    2: \"局部多云\",\n    3: \"阴天\",\n    45: \"有雾\"\
          ,\n    48: \"雾凇\",\n    51: \"小毛毛雨\",\n    53: \"中等毛毛雨\",\n    55: \"大毛毛雨\"\
          ,\n    56: \"轻度冻毛毛雨\",\n    57: \"强冻毛毛雨\",\n    61: \"小雨\",\n    63: \"\
          中雨\",\n    65: \"大雨\",\n    66: \"轻度冻雨\",\n    67: \"强冻雨\",\n    71: \"\
          小雪\",\n    73: \"中雪\",\n    75: \"大雪\",\n    77: \"雪粒\",\n    80: \"小阵雨\"\
          ,\n    81: \"中阵雨\",\n    82: \"强阵雨\",\n    85: \"小阵雪\",\n    86: \"大阵雪\"\
          ,\n    95: \"雷暴\",\n    96: \"雷暴伴小冰雹\",\n    99: \"雷暴伴大冰雹\"\n}\n\ndef main(weather_response,\
          \ found, city_name, admin1, country) -> dict:\n    # 兼容 Dify 传入布尔值或文字值的情况。\n\
          \    is_found = found if isinstance(found, bool) else str(found).lower()\
          \ == \"true\"\n\n    # 找不到城市时，返回完整且匹配的输出字段。\n    if not is_found:\n    \
          \    error_text = \"没有找到这个城市，请换一个更常见的城市名称，例如北京、上海或广州。\"\n        return\
          \ {\n            \"weather_text\": error_text,\n            \"temperature\"\
          : 0.0,\n            \"humidity\": 0.0,\n            \"wind_speed\": 0.0,\n\
          \            \"description\": \"未找到城市\"\n        }\n\n    # HTTP 节点可能返回\
          \ JSON 文本或对象，两种都兼容。\n    if isinstance(weather_response, str):\n       \
          \ data = json.loads(weather_response)\n    else:\n        data = weather_response\n\
          \n    current = data.get(\"current\", {}) if isinstance(data, dict) else\
          \ {}\n\n    # 把天气代码转换成整数。\n    try:\n        weather_code = int(current.get(\"\
          weather_code\"))\n    except (TypeError, ValueError):\n        weather_code\
          \ = -1\n\n    description = WEATHER_CODE_MAP.get(weather_code, \"未知天气\"\
          )\n\n    # 拼出国家、省份和城市。\n    location_parts = []\n    if country:\n     \
          \   location_parts.append(country)\n    if admin1:\n        location_parts.append(admin1)\n\
          \    if city_name:\n        location_parts.append(city_name)\n\n    location\
          \ = \" \".join(location_parts) if location_parts else \"该城市\"\n\n    # 把可能为空的数值转成浮点数。\n\
          \    def to_float(value):\n        try:\n            return float(value)\n\
          \        except (TypeError, ValueError):\n            return 0.0\n\n   \
          \ temperature = to_float(current.get(\"temperature_2m\"))\n    feels_like\
          \ = to_float(current.get(\"apparent_temperature\"))\n    humidity = to_float(current.get(\"\
          relative_humidity_2m\"))\n    wind_speed = to_float(current.get(\"wind_speed_10m\"\
          ))\n    data_time = current.get(\"time\", \"未知时间\")\n\n    weather_text\
          \ = (\n        f\"{location}当前天气：{description}；\"\n        f\"气温 {temperature:.1f}°C；\"\
          \n        f\"体感温度 {feels_like:.1f}°C；\"\n        f\"相对湿度 {humidity:.0f}%；\"\
          \n        f\"风速 {wind_speed:.1f} km/h；\"\n        f\"数据时间 {data_time}。\"\
          \n    )\n\n    return {\n        \"weather_text\": weather_text,\n     \
          \   \"temperature\": temperature,\n        \"humidity\": humidity,\n   \
          \     \"wind_speed\": wind_speed,\n        \"description\": description\n\
          \    }\n"
        code_language: python3
        outputs:
          description:
            children: null
            type: string
          humidity:
            children: null
            type: number
          temperature:
            children: null
            type: number
          weather_text:
            children: null
