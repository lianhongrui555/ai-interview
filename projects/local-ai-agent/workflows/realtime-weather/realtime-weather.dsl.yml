    - data:
        code: "import json\n\ndef main(geocode_response) -> dict:\n    # HTTP 节点有时返回对象，有时返回\
          \ JSON 文本，所以先统一处理。\n    if isinstance(geocode_response, str):\n        data\
          \ = json.loads(geocode_response)\n    else:\n        data = geocode_response\n\
          \n    # 取出城市搜索结果；如果结果不是字典，就当作没有找到。\n    results = data.get(\"results\",\
          \ []) if isinstance(data, dict) else []\n\n    # 找不到城市时返回固定坐标，避免后续 HTTP\
          \ 节点因为空坐标报错。\n    if not results:\n        return {\n            \"found\"\
          : False,\n            \"latitude\": 0.0,\n            \"longitude\": 0.0,\n\
          \            \"city_name\": \"\",\n            \"admin1\": \"\",\n     \
          \       \"country\": \"\"\n        }\n\n    # 取第一个匹配城市。\n    first = results[0]\n\
          \n    return {\n        \"found\": True,\n        \"latitude\": float(first.get(\"\
          latitude\") or 0.0),\n        \"longitude\": float(first.get(\"longitude\"\
          ) or 0.0),\n        \"city_name\": first.get(\"name\", \"\"),\n        \"\
          admin1\": first.get(\"admin1\", \"\"),\n        \"country\": first.get(\"\
          country\", \"\")\n    }\n"
        code_language: python3
        desc: 提取城市坐标
